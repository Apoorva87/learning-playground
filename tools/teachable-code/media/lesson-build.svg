<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="title desc">
  <title id="title">What the Teachable Code builder checks</title>
  <desc id="desc">An authored step and a clean, pinned source checkout enter the builder. It validates the line range and expected text, then packages the actual excerpt in a standalone lesson.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#37594f"/></marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #253d37 }
      .title { font-size: 22px; font-weight: 650 }
      .body { font-size: 18px }
      .small { font-size: 15px; letter-spacing: 1px; font-weight: 600 }
      .arrow { stroke: #37594f; stroke-width: 2.5; fill: none; marker-end: url(#arrow) }
    </style>
  </defs>
  <rect width="760" height="400" fill="#f8faf7"/>
  <g transform="translate(28 27)">
    <rect width="332" height="92" rx="10" fill="#e8ede2" stroke="#798a75"/>
    <text x="19" y="33" class="title">Lesson step</text>
    <text x="19" y="65" class="body">Path, line range, expected text</text>
  </g>
  <g transform="translate(400 27)">
    <rect width="332" height="92" rx="10" fill="#e8ede2" stroke="#798a75"/>
    <text x="19" y="33" class="title">Source checkout</text>
    <text x="19" y="65" class="body">Pinned commit, clean tree</text>
  </g>
  <path d="M194 119 V143 H299 V170" class="arrow"/>
  <path d="M566 119 V143 H461 V170" class="arrow"/>
  <rect x="104" y="176" width="552" height="86" rx="10" fill="#dbe9e6" stroke="#4b7066"/>
  <text x="380" y="208" text-anchor="middle" class="title">Validate the citation</text>
  <text x="380" y="238" text-anchor="middle" class="body">Read the real lines and check for the expected text</text>
  <path d="M380 262 V299" class="arrow"/>
  <rect x="104" y="307" width="552" height="69" rx="10" fill="#25473f"/>
  <text x="380" y="336" text-anchor="middle" class="small" style="fill:#e2efdc">BROWSER LESSON</text>
  <text x="380" y="362" text-anchor="middle" class="body" style="fill:white">Map, step, evidence and checked excerpt</text>
</svg>
