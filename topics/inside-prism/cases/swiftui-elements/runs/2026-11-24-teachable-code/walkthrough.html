he screen","title":"Where the screen starts","cap":"The app puts RootView inside its window.","plain":"Read the braces as boxes inside boxes. WindowGroup is the outer container. RootView() creates Prism’s top-level interface inside it. The calls beginning with a dot configure that view. Here, environment(model) gives the screens below access to shared data such as the movie catalog.","why":"The app can give Browse and Search the same catalog. Each screen can then decide how to present a title.","facts":[["WindowGroup","The outer container"],["RootView()","Make the root interface"],[".environment(model)","Supply shared data to child views"]],"show":["discover","live","library","settings","app","tabs","layout","grid","poster","focus","play","search","results","match"],"focus":["app"],"flow":[],"input":{"type":"text","label":"Starting point","text":"Launch the Apple TV app","prov":"read"},"transform":{"label":"Create a window","text":"Place RootView in WindowGroup."},"output":{"type":"text","label":"First view","text":"RootView with shared app state","prov":"read"},"log":["tvOS","App window","The app puts RootView inside its window.",""],"code":{"f":"RelayTV/Sources/RelayTVApp.swift","a":127,"b":130,"must":"RootView().environment(model)","text":"    var body: some Scene {\n        WindowGroup {\n            RootView().environment(model).environment(enrichment).environment(discover).environment(ratings)\n                .task { await RelayTVApp.addBundledTrialPortal(model) }"}},{"id":"tabs","chapter":"Build the screen","title":"What makes the six tabs?","cap":"One TabView connects each tab label to a page.","plain":"Read the Browse line left to right. BrowsePage() creates the page, Text(\"Browse\") supplies its tab label, and tag(AppTab.browse) gives it an identity. The $ in $tab is a binding. When you choose a tab, the control can write the new choice into tab. SwiftUI uses that choice to display the matching page.","why":"The same section names stay available as you move around. You can go straight from browsing to searching.","facts":[["Text","Put words on the screen"],[".tag","Give a page an identity"],["$tab","A connection the control can read and write"]],"show":[],"focus":["tabs"],"flow":[{"from":"app","to":"tabs","label":"Update selection"}],"input":{"type":"text","label":"Your choice","text":"Choose Browse","prov":"illustrative"},"transform":{"label":"Update selection","text":"Set tab to .browse."},"output":{"type":"text","label":"Visible section","text":"BrowsePage()","prov":"read"},"log":["App window","Tabs","One TabView connects each tab label to a page.",""],"code":{"f":"RelayDesign/Sources/RelayUI/Shell/RootView.swift","a":47,"b":55,"must":"TabView(selection: $tab)","text":"    public var body: some View {\n        TabView(selection: $tab) {\n            stack(.discover) { DiscoverPage() }.tabItem { Text(\"Discover\") }.tag(AppTab.discover)\n            stack(.live) { LiveTVPage() }.tabItem { Text(\"Live TV\") }.tag(AppTab.live)\n            stack(.browse) { BrowsePage() }.tabItem { Text(\"Browse\") }.tag(AppTab.browse)\n            stack(.library) { LibraryPage() }.tabItem { Text(\"Library\") }.tag(AppTab.library)\n            stack(.search) { SearchPage() }.tabItem { Label(\"Search\", systemImage: \"magnifyingglass\") }.tag(AppTab.search)\n            stack(.settings) { SettingsPage() }.tabItem { Label(\"Settings\", systemImage: \"gearshape\") }.tag(AppTab.settings)\n        }"}},{"id":"layout","chapter":"Build the screen","title":"Why categories sit beside posters","cap":"HStack places the rail and the catalog side by side.","plain":"Start at the outer HStack. Its first child is a VStack that stacks a header above the category list, named rail. Its second child is grid. H means horizontal, V means vertical. Inside the header, Text displays the word Categories and another Text shows the count. The rail keeps a fixed width.","why":"You can see the category list while exploring its titles. The list gives you a way to narrow the catalog without leaving Browse.","facts":[["HStack","Side by side"],["VStack","One above the next"],[".frame(width:)","Reserve a width for the rail"]],"show":[],"focus":["layout"],"flow":[{"from":"tabs","to":"layout","label":"Arrange horizontally"}],"input":{"type":"text","label":"Two children","text":"Category rail and grid","prov":"read"},"transform":{"label":"Arrange horizontally","text":"HStack puts its children next to each other with 36 points between them."},"output":{"type":"text","label":"Browse layout","text":"Left: Categories and their names\nRight: titles in the chosen category","prov":"read"},"log":["Tabs","Categories","HStack places the rail and the catalog side by side.",""],"code":{"f":"RelayDesign/Sources/RelayUI/Pages/Browse/BrowseCategories.swift","a":41,"b":56,"must":"HStack(alignment: .top, spacing: 36)","text":"    var body: some View {\n        // One slim header row: the list's title beside the grid's Sort / Filters / View.\n        HStack(alignment: .top, spacing: 36) {\n            VStack(alignment: .leading, spacing: 0) {\n                HStack(alignment: .firstTextBaseline, spacing: 12) {\n                    Text(\"Categories\").font(.system(size: 28, weight: .bold)).foregroundStyle(Theme.text)\n                    Text(\"\\(categories.count)\").font(Theme.Fonts.meta).foregroundStyle(Theme.text3)\n                    Spacer(minLength: 0)\n                }\n                .frame(height: 60)\n                rail\n            }\n            .frame(width: Self.railWidth)\n            .modalDimmed(sheets?.isActive == true)\n            grid\n        }"}},{"id":"grid","chapter":"Build the screen","title":"How one template makes a whole grid","cap":"Each visible title supplies one PosterCard.","plain":"ScrollView(.vertical) lets you move down the catalog. LazyVGrid arranges cards into columns and creates views as needed. ForEach takes one title at a time and calls it t. PosterCard receives that title. The braces after PosterCard contain its action. On Select, show(.title(t)) opens that title’s details.","why":"Changing the number of columns can fit more movies on screen while keeping each card’s behavior consistent.","facts":[["t","This particular title"],["ForEach","Build a view for each item"],[".onPlayPauseCommand","Give the remote’s Play/Pause key its own action"]],"show":[],"focus":["grid"],"flow":[{"from":"layout","to":"grid","label":"Repeat the card"}],"input":{"type":"text","label":"Example catalog","text":"Interstellar and two other titles","prov":"illustrative"},"transform":{"label":"Repeat the card","text":"Use each title’s stable ID to identify its card."},"output":{"type":"text","label":"Screen elements","text":"One selectable poster per title","prov":"read"},"log":["Categories","Title grid","Each visible title supplies one PosterCard.",""],"code":{"f":"RelayDesign/Sources/RelayUI/Pages/Browse/RowGridPage.swift","a":344,"b":355,"must":"show(.title(t))","text":"        return ScrollViewReader { proxy in\n        ScrollView(.vertical) {\n            LazyVGrid(columns: Array(repeating: GridItem(.fixed(m.posterWidth), spacing: m.spacing, alignment: .top), count: m.columns),\n                      alignment: .leading, spacing: m.showsCaptions ? 24 : m.spacing) {\n                ForEach(Array(visible.enumerated()), id: \\.element.id) { i, t in\n                    PosterCard(title: t, width: m.posterWidth, showsCaption: m.showsCaptions,\n                               progress: BrowseLibraryInfo.progress(t, library: model.library),\n                               watched: BrowseLibraryInfo.watched(t, library: model.library)) {\n                        lastFocusedID = t.id; show(.title(t))\n                    }\n                    .focused($focusedID, equals: t.id)\n                    .onPlayPauseCommand { play(.title(t, nil)) }"}},{"id":"poster","chapter":"Read a control","title":"How artwork and a caption become one button","cap":"PosterCard puts a vertical stack inside a button.","plain":"Button(action: action) makes the card selectable. Inside it, VStack puts artwork above a caption. The frame makes the art one and a half times as tall as it is wide. If showsCaption is true, Caption displays the name and available year or genre. The action comes from the screen that created this card.","why":"A user can press anywhere on the card. The caption helps identify a film even when its artwork is unfamiliar.","facts":[[".overlay","Layer another visual over the art"],[".frame","Set the size of the artwork"],["if showsCaption","Include the caption when enabled"]],"ask":{"q":"You want to hide a poster’s caption but keep the film selectable. Which part would you change?","options":["The showsCaption input","The action on the Button","The selected tab"],"answer":0,"explain":"The caption has its own condition inside the button. The grid passes that condition as an input."},"show":[],"focus":["poster"],"flow":[{"from":"grid","to":"poster","label":"Compose the label"}],"input":{"type":"text","label":"One title","text":"Interstellar, with captions enabled","prov":"illustrative"},"transform":{"label":"Compose the label","text":"Put artwork and caption inside the same Button."},"output":{"type":"text","label":"One control","text":"Poster image above the title","prov":"read"},"log":["Title grid","Poster","PosterCard puts a vertical stack inside a button.",""],"code":{"f":"RelayDesign/Sources/RelayUI/Components/Components.swift","a":140,"b":157,"must":"if showsCaption","text":"    public var body: some View {\n        Button(action: action) {\n            VStack(alignment: .leading, spacing: 12) {\n                EnrichedArtworkView(title: title, categoryID: categoryID)\n                    // Movies preview when focus rests on them (series have episodes instead).\n                    .overlay { FocusPreviewOverlay(key: title.kind == .movie ? \"movie:\\(title.id)\" : nil, request: .title(title, nil)) }\n                    .animation(.easeIn(duration: 0.35), value: FocusPreview.shared.playingKey == \"movie:\\(title.id)\")\n                    .overlay(ArtworkBadges(quality: title.versions.first?.label.contains(\"4K\") == true ? \"4K\" : nil,\n                                           sourceCount: Set(title.versions.map(\\.sourceID)).count, watched: watched, progress: progress))\n                    .playbackIssueMark(title.id)\n                    .clipShape(RoundedRectangle(cornerRadius: Theme.Metrics.radius))\n                    .frame(width: width, height: width * 1.5)\n                    .cardFocusEffect()\n                if showsCaption { Caption(primary: title.name, secondary: [title.year.map(String.init), title.genres.first].compactMap { $0 }.joined(separator: \" · \")) }\n            }\n            .frame(width: width)\n        }\n        .buttonStyle(CardButtonStyle())"}},{"id":"focus","chapter":"Read a control","title":"What draws the white focus ring?","cap":"Moving the remote changes which card gets a five-point border.","plain":"tvOS keeps track of the control the remote points to. Prism’s button style passes that information to the artwork as cardFocused. Read focused ? 5 : 0 as “use five when focused, otherwise zero.” The next lines also enlarge the card and add a shadow. Select activates the current card.","why":"A TV has no mouse pointer. The ring shows which movie would open if you pressed Select now.","facts":[["@Environment","Read a value supplied to this view"],[".strokeBorder","Draw inside the shape’s boundary"],[".scaleEffect","Change the visible size"]],"ask":{"q":"You moved right once across the movie grid. What does the ring tell you?","options":["The movie has started","Select would open the highlighted movie"],"answer":1,"explain":"Moving transfers focus. The grid runs show(.title(t)) when the card is activated."},"show":[],"focus":["focus"],"flow":[{"from":"poster","to":"focus","label":"Change focus"}],"input":{"type":"text","label":"Remote input","text":"Move across to the next card","prov":"illustrative"},"transform":{"label":"Change focus","text":"The newly focused card reads true."},"output":{"type":"text","label":"Visual response","text":"White border, larger artwork, shadow","prov":"read"},"log":["Poster","Focus ring","Moving the remote changes which card gets a five-point border.",""],"code":{"f":"RelayDesign/Sources/RelayUI/Components/Focus.swift","a":62,"b":71,"must":"lineWidth: focused ? 5 : 0","text":"public struct CardFocusEffect: ViewModifier {\n    @Environment(\\.cardFocused) private var focused\n    var cornerRadius: CGFloat\n    public func body(content: Content) -> some View {\n        content\n            .overlay(RoundedRectangle(cornerRadius: cornerRadius).strokeBorder(.white, lineWidth: focused ? 5 : 0))\n            .scaleEffect(focused ? Theme.Metrics.cardFocusScale : 1)\n            .shadow(color: .black.opacity(focused ? 0.75 : 0), radius: 26, y: 24)\n            .zIndex(focused ? 1 : 0)\n    }"}},{"id":"play","chapter":"Read a control","title":"Why the detail screen can say Play or Resume","cap":"The button’s label and its action are separate pieces of code.","plain":"On a title’s detail screen, Text(playLabel) draws the words and Button(action: playMain) connects a press to a function. Above this excerpt, playLabel reads saved progress to choose Play or Resume. The disabled condition checks whether a version or episode is available. The neighboring Watchlist button changes the library and reads its state back into its label.","why":"A returning viewer sees the action that applies to their progress. A disabled Play button also communicates when playback is unavailable.","facts":[["Text(playLabel)","What you see"],["playMain","What Select invokes"],[".disabled","When the control cannot be activated"]],"show":[],"focus":["play"],"flow":[{"from":"poster","to":"play","label":"Attach an action"}],"input":{"type":"text","label":"Detail screen","text":"A movie with a playable version and no saved progress","prov":"illustrative"},"transform":{"label":"Attach an action","text":"playMain requests playback of the selected movie version."},"output":{"type":"text","label":"Button label","text":"▶ Play","prov":"illustrative"},"log":["Poster","Title details","The button’s label and its action are separate pieces of code.",""],"code":{"f":"RelayDesign/Sources/RelayUI/Pages/Browse/TitleDetailPage.swift","a":211,"b":222,"must":"Button(action: playMain)","text":"        let optionCount = title.versions.count + airings.count\n        return HStack(spacing: 16) {\n            Button(action: playMain) { Text(playLabel) }\n                .buttonStyle(RelayButtonStyle(.pill))\n                .disabled(version == nil && firstEpisode == nil && episodeResume == nil)\n                .focused($actionFocus, equals: .play)\n            Button { sheet = .watchOptions } label: { Text(\"Watch options · \\(optionCount)\") }\n                .buttonStyle(RelayButtonStyle(.pill))\n                .focused($actionFocus, equals: .options)\n            Button { model.library.toggleWatchlist(title) } label: { Text(inWatchlist ? \"✓ In watchlist\" : \"＋ Watchlist\") }\n                .buttonStyle(RelayButtonStyle(.pill, isOn: inWatchlist))\n                .focused($actionFocus, equals: .watchlist)"}},{"id":"search","chapter":"Follow a change","title":"What makes the search field?","cap":"The field writes what you type into query.","plain":"The searchable modifier adds the system search field. Its prompt tells you what you can look up. Prism stores the editable text in @State private var query. The binding $query keeps the field and that value in sync. Submitting calls run(query). Prism separately remembers the submitted words so typing and viewing results can have different layouts.","why":"The field can offer suggestions while you are still spelling a title. Submitting gives the results a specific query to answer.","facts":[[".searchable","Add the standard search field"],["$query","Two-way connection to the typed text"],[".onSubmit","Run an action when the search is submitted"]],"show":[],"focus":["search"],"flow":[{"from":"tabs","to":"search","label":"Keep text in state"}],"input":{"type":"text","label":"Keyboard input","text":"Type interstellar, then submit","prov":"illustrative"},"transform":{"label":"Keep text in state","text":"Typing updates query. Submitting calls run(query)."},"output":{"type":"text","label":"Search request","text":"interstellar","prov":"illustrative"},"log":["Tabs","Search field","The field writes what you type into query.",""],"code":{"f":"RelayDesign/Sources/RelayUI/Pages/Search/SearchPage.swift","a":49,"b":61,"must":".onSubmit(of: .search) { run(query) }","text":"        .searchable(text: $query, prompt: \"Movies, shows, channels, people, teams\")\n        // Page-level so they open as full side panels on the right.\n        .sideSheet(isPresented: $pickingScopeCategory, width: 760) {\n            SearchScopeCategorySheet(categories: scopeCategories, selected: scopeKey) { id in\n                pickingScopeCategory = false\n                setScope(\"cat:\" + id)\n            }\n        }\n        // Unlocking private content (PIN) happens only in Settings › Content visibility; when it\n        // changes, a search on screen is run again.\n        .onChange(of: model.visibility.adultLocked) { _, _ in if submitted != nil { searchAgain() } }\n        .onSubmit(of: .search) { run(query) }\n        .onChange(of: query) { _, new in"}},{"id":"match","chapter":"Follow a change","title":"How typed words find a title","cap":"The matcher compares words before the screen lays out results.","plain":"The search field supplies text. Behind the interface, Prism converts it into comparable words. In this function, q holds the query words and c holds a title’s words. If both lists are equal, the match is exact. A two-letter start can earn a prefix match. We ran the matcher against one title three times.","why":"The same poster can be a close or exact match depending on what you type. The ranking code can use that distinction when choosing what to show first.","facts":[["q == c","Compare the two lists"],["return","Give the answer back to the caller"],["nil","No match from this function"]],"show":[],"focus":["match"],"flow":[{"from":"search","to":"match","label":"Compare words"}],"input":{"type":"text","label":"Inputs we ran","text":"in → Interstellar\nINTERSTELLAR → Interstellar\ndune → Interstellar","prov":"ran"},"transform":{"label":"Compare words","text":"Equality earns exact. A matching beginning with at least two characters can earn prefix."},"output":{"type":"text","label":"Observed match tiers","text":"in → prefix\nINTERSTELLAR → exact\ndune → none","prov":"ran"},"log":["Search field","Title matcher","The matcher compares words before the screen lays out results.",""],"code":{"f":"RelayKit/Sources/RelayCore/Services/TextMatch.swift","a":87,"b":95,"must":"if q == c","text":"    /// Tier for folded query words against folded candidate words; nil = no match.\n    public static func of(query q: [String], candidate c: [String]) -> MatchTier? {\n        guard !q.isEmpty, !c.isEmpty else { return nil }\n        if q == c { return .exact }\n        if TextMatch.containsPhrase(c, q) { return .phrase }\n        let set = Set(c)\n        if q.allSatisfy(set.contains) { return .allWords }\n        func isPrefix(_ w: String) -> Bool { set.contains(w) || (w.count >= 2 && c.contains { $0.hasPrefix(w) }) }\n        if q.allSatisfy(isPrefix) { return .prefix }"}},{"id":"results","chapter":"Follow a change","title":"How related results form a horizontal row","cap":"The results page turns a set of titles into a scrollable strip.","plain":"RowHeader shows the section name and count. Below it, ScrollView(.horizontal) lets the row slide sideways. LazyHStack places a poster for each of the first 14 titles. If there are more and a destination tab is available, SeeAllTile opens that tab. In Prism’s search test, Interstellar is the best title and The Science of Interstellar leads the remaining titles.","why":"A best match can stand out while related movies stay within reach. A short row also leaves room on the screen for other groups of results.","facts":[["RowHeader","Name and count for the group"],["LazyHStack","Create cards as needed in a horizontal line"],["SeeAllTile","A way to continue beyond the preview"]],"show":[],"focus":["results"],"flow":[{"from":"match","to":"results","label":"Arrange the group"}],"input":{"type":"text","label":"Titles for a section","text":"A Movies group with more than one result","prov":"illustrative"},"transform":{"label":"Arrange the group","text":"Build one poster per item and cap the preview at 14."},"output":{"type":"text","label":"Layout","text":"Section heading above a sideways poster row","prov":"read"},"log":["Title matcher","Results row","The results page turns a set of titles into a scrollable strip.",""],"code":{"f":"RelayDesign/Sources/RelayUI/Pages/Search/SearchResultsView.swift","a":97,"b":110,"must":"ForEach(titles.prefix(14))","text":"    private func titleStrip(_ titles: [Title], title: String, tab: SearchTab?, width: CGFloat) -> some View {\n        VStack(alignment: .leading, spacing: 12) {\n            RowHeader(title, detail: \"\\(titles.count)\")\n            ScrollView(.horizontal) {\n                LazyHStack(alignment: .top, spacing: 26) {\n                    ForEach(titles.prefix(14)) { t in poster(t, width: width) }\n                    if titles.count > 14, let tab {\n                        SeeAllTile(\"See all\", detail: \"\\(titles.count)\", size: CGSize(width: width, height: width * 1.5)) { onTab(tab) }\n                    }\n                }.padding(.vertical, 24)\n            }.scrollClipDisabled()\n            unavailableNote(titles)\n        }\n        .focusSection()"}},{"id":"discover","chapter":"Explore the other tabs","title":"How Discover builds its feed","cap":"The toolbar and header sit above a vertically scrolling feed.","plain":"Read the outer VStack from top to bottom. optionsRow comes first. DiscoverHeader sits beneath it. Inside the vertical scroll area, a LazyVStack places status and continueRow before the trend rows. ForEach asks Prism to make a new row for each matching item in its data.","why":"A stable header gives context while the collection of movie rows below it can change as the catalog changes.","facts":[["optionsRow","The toolbar"],["DiscoverHeader","Information about the highlighted item"],["LazyVStack","Make a vertical group as its children are needed"]],"show":[],"focus":["discover"],"flow":[{"from":"tabs","to":"discover","label":"Compose a feed"}],"input":{"type":"text","label":"Feed data","text":"A collection of discovery rows","prov":"read"},"transform":{"label":"Compose a feed","text":"Place the header before the scrolling rows."},"output":{"type":"text","label":"Screen","text":"Toolbar, information header and rows","prov":"read"},"log":["Tabs","Discover","The toolbar and header sit above a vertically scrolling feed.",""],"code":{"f":"RelayDesign/Sources/RelayUI/Pages/Discover/DiscoverPage.swift","a":39,"b":55,"must":"DiscoverHeader","text":"    public var body: some View {\n        let rows = allRows()\n        let finished = finishedIDs\n        VStack(alignment: .leading, spacing: 0) {\n            // Like Browse: options as a toolbar, a compact info area, then the rows.\n            optionsRow\n            // Built inside its own view: scores and enrichment arriving redraw only the header.\n            DiscoverHeader { headerModel(rows, finished: finished) }\n                .padding(.horizontal, 90).padding(.top, 2)\n            ScrollViewReader { proxy in\n                ScrollView(.vertical, showsIndicators: false) {\n                    LazyVStack(alignment: .leading, spacing: 4) {\n                        Color.clear.frame(height: 0).id(Self.top)\n                        status\n                        continueRow\n                        ForEach(rows.filter { $0.service == nil && $0.genre == nil }) { trendRow($0) }\n                        servicePicker"}},{"id":"live","chapter":"Explore the other tabs","title":"Where the channel controls come from","cap":"Live TV offers different controls depending on the channel list.","plain":"Label combines words with an icon. Pressing Add or remove sets picking to true, which opens the channel picker. The next button lives inside if channels.count > 1. When there are at least two channels, SwiftUI includes Reorder and connects it to a separate action.","why":"The list offers reordering once you have enough channels to rearrange. Conditional views let the interface reflect what is possible right now.","facts":[["Label","Combine words and a symbol"],["picking = true","Open channel selection"],[".focused","Associate the button with a named focus target"]],"show":[],"focus":["live"],"flow":[{"from":"tabs","to":"live","label":"Evaluate the condition"}],"input":{"type":"text","label":"Your channels","text":"Two favourite channels","prov":"illustrative"},"transform":{"label":"Evaluate the condition","text":"Two is greater than one, so include the button."},"output":{"type":"text","label":"Header controls","text":"Add or remove · Reorder","prov":"illustrative"},"log":["Tabs","Live TV","Live TV offers different controls depending on the channel list.",""],"code":{"f":"RelayDesign/Sources/RelayUI/Pages/Live/LiveTVPage.swift","a":43,"b":50,"must":"if channels.count > 1","text":"                Button { picking = true } label: { Label(\"Add or remove\", systemImage: \"plus\") }\n                    .buttonStyle(RelayButtonStyle(.chip))\n                    .focused($header, equals: .add)\n                if channels.count > 1 {\n                    Button { reordering = true } label: { Label(\"Reorder\", systemImage: \"arrow.up.arrow.down\") }\n                        .buttonStyle(RelayButtonStyle(.chip))\n                        .focused($header, equals: .reorder)\n                }"}}, <script>/* Teachable Code lesson runtime. Reads one lesson JSON; renders the story beside a 3D (Three.js) or 2D (SVG) stage. */
(function () {
  const L = JSON.parse(document.getElementById("lesson").textContent), $ = id => document.getElementById(id);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n.replace(/^var\((.*)\)$/, "$1")).trim();
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const calm = matchMedia("(prefers-reduced-motion:reduce)").matches, vis = c => c === "\n" ? "⏎" : c === " " ? "␣" : c;
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), backOut = u => { const k = 1.55; u -= 1; return 1 + (k + 1) * u * u * u + k * u * u; };
  const PROV = { ran: "ran", read: "read from code", illustrative: "example" }, ICON = { play: '<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>', pause: '<svg viewBox="0 0 16 16"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>' };
  let cur = 0, playing = false, speed = 1, guess = false, timer = 0, stage = null, inspect = null, sel = null; const answered = {}, dirOpen = new Set(), dirAll = new Set();
  /* the map: stations are permanent parts of the system; objects are the data sitting on them */
  const is3D = L.stage.mode === "3d", STN = is3D ? L.stage.stations : Object.fromEntries(Object.entries(L.stage.objects).filter(([, d]) => d.type !== "group"));
  const stationOf = id => is3D ? (L.stage.objects[id] || {}).at : id;
  const fileStations = path => Object.keys(STN).filter(k => (STN[k].files || []).some(f => f === path || f.startsWith(path + "/")));
  const stFiles = new Set(Object.values(STN).flatMap(s => s.files || []));
  const litStations = i => { const s = new Set(); stateAt(i).focus.forEach(o => { const k = stationOf(o); if (k) s.add(k); }); return s; };

  /* ---------- state: replaying steps makes any step reachable directly ---------- */
  function stateAt(i) {
    const v = new Set(), ever = new Set(), set = {};
    for (let k = 0; k <= i; k++) { const s = L.steps[k]; (s.hide === "all" ? [...v] : s.hide || []).forEach(x => v.delete(x)); (s.show || []).forEach(x => { v.add(x); ever.add(x); }); Object.assign(set, s.set || {}); }
    const s = L.steps[i], fl = (s.flow || []).flatMap(f => [f.from, f.to]);
    return { visible: v, ever, set, focus: s.focus || ((s.show || []).length ? s.show : fl) };
  }

  /* ---------- value renderers: same formats for input and output, so they compare directly ---------- */
  function heat(v, max) { const a = Math.min(1, Math.abs(v) / (max || 1)), c = v < 0 ? "var(--neg)" : "var(--pos)"; return `color-mix(in srgb,${c} ${Math.round(a * 88)}%,transparent)`; }
  function val(v) {
    if (!v) return "";
    if (v.type === "chips") return `<div class="chips">${v.items.map((x, i) => `<span class="chip${(v.hi || []).includes(i) ? " hi" : ""}">${esc(vis(x))}${v.subs ? `<small>${esc(v.subs[i])}</small>` : ""}</span>`).join("")}</div>`;
    if (v.type === "matrix") {
      const m = v.values, max = Math.max(...m.flat().map(Math.abs)), cols = m[0].length, num = cols <= (v.numCols || 8), sz = num ? "minmax(40px,auto)" : "14px";
      const head = v.colLabels ? `<span></span>${v.colLabels.map(c => `<span style="color:var(--muted)">${esc(vis(c))}</span>`).join("")}` : "";
      return `<div class="scroll"><div class="mat" style="grid-template-columns:auto repeat(${cols},${sz})">${head}${m.map((r, i) => `<span class="rl">${esc(vis(v.rowLabels ? v.rowLabels[i] : i))}</span>` + r.map((x, j) => `<span class="${v.mark && v.mark[0] === i && v.mark[1] === j ? "mark" : ""}" style="background:${heat(x, max)}${num ? "" : ";min-width:14px;padding:0"}" title="${x}">${num ? (+x).toFixed(v.digits ?? 2) : ""}</span>`).join("")).join("")}</div></div>${v.note ? `<div class="eyebrow" style="margin-top:6px;font-weight:500">${esc(v.note)}</div>` : ""}`;
    }
    if (v.type === "bars") { const max = v.max || Math.max(...v.items.map(x => x[1])); return `<div class="scroll">${v.items.map((x, i) => `<div class="barrow${(v.hi || []).includes(i) ? " hi" : ""}"><span>${esc(vis(x[0]))}</span><div class="bar"><i style="width:${(100 * x[1] / max).toFixed(1)}%"></i></div><em>${v.pct ? (x[1] * 100).toFixed(1) + "%" : x[1]}</em></div>`).join("")}</div>`; }
    if (v.type === "segments") return `<div class="scroll">${v.items.map(s => `<div class="seg" style="--sc:${s.color || "var(--c)"}"><small>${s.size || ""}</small><b>${esc(s.label)}</b><div>${esc(s.text)}</div></div>`).join("")}</div>`;
    if (v.type === "pair") return v.items.map(x => `<div class="iolab" style="margin:7px 0 4px;font-weight:500">${esc(x.label)}</div>${val(x)}`).join("");
    if (v.tf) return `<div class="tfbody">${esc(v.text).replace(/&lt;code&gt;(.*?)&lt;\/code&gt;/g, "<code>$1</code>").replace(/\n/g, "<br>")}</div>`;
    return `<div class="scroll"><pre class="val">${esc(v.text ?? "")}</pre></div>`;
  }
  const box = (name, color, v, mid) => `<div class="iobox${mid ? " mid" : ""}" style="--c:var(${color})"><div class="iohead"><b>${name}</b>${v.prov ? `<span class="badge ${v.prov}">${PROV[v.prov]}</span>` : ""}</div><div class="iolab">${esc(v.label || "")}</div>${val(v)}</div>`;

  /* ---------- panels ---------- */
  function rail() {
    const lit = litStations(cur), here = (L.steps[cur].code || {}).f, litFiles = new Set([...lit].flatMap(k => STN[k].files || [])), hit = n => n.steps || stFiles.has(n.path), has = n => n.dir ? (n.kids || []).some(has) : hit(n);
    const node = (n, pre) => {
      const path = pre + n.name;
      if (n.dir) { const canOpen = !!n.kids, open = dirOpen.has(path) || (canOpen && has(n) && !dirOpen.has("!" + path)); return `<li><button class="d" data-dir="${esc(path)}" title="${esc(n.note || "")}"><span class="caret">${canOpen ? (open ? "▾" : "▸") : ""}</span><span>${esc(n.name)}/</span><small>${n.files}</small></button>${open ? list(n.kids, path + "/", path) : ""}</li>`; }
      return `<li><button class="f${hit(n) ? "" : " quiet"}${litFiles.has(n.path) ? " lit" : ""}${n.path === here ? " cur" : ""}${sel === n.path ? " sel" : ""}" data-file="${esc(n.path)}" title="${esc(n.note || n.path)}"><span class="caret"></span><span>${esc(n.name)}</span>${n.steps ? `<small>${n.steps.map(x => x + 1).join(" ")}</small>` : ""}</button></li>`;
    };
    const list = (kids, pre, key) => { const dirs = kids.filter(n => n.dir), on = kids.filter(n => !n.dir && hit(n)), off = kids.filter(n => !n.dir && !hit(n)), all = dirAll.has(key); return `<ul>${dirs.map(n => node(n, pre)).join("")}${on.map(n => node(n, pre)).join("")}${all ? off.map(n => node(n, pre)).join("") : ""}${off.length ? `<li><button class="more" data-more="${esc(key)}"><span class="caret"></span>${all ? "hide other files" : `+ ${off.length} other file${off.length === 1 ? "" : "s"}`}</button></li>` : ""}</ul>`; };
    const r = $("railbody"), keep = r.scrollTop; r.innerHTML = `<div class="tree">${list(L.tree.kids, "", "")}</div>`; r.scrollTop = keep;
    r.querySelectorAll("[data-file]").forEach(b => { b.onclick = () => openFile(b.dataset.file); b.onmouseenter = () => stage && stage.lit(fileStations(b.dataset.file)); b.onmouseleave = () => stage && stage.lit(inspectLit()); });
    r.querySelectorAll("[data-dir]").forEach(b => { b.onclick = () => { const k = b.dataset.dir, open = dirOpen.has(k) || !dirOpen.has("!" + k); if (open) { dirOpen.delete(k); dirOpen.add("!" + k); } else { dirOpen.delete("!" + k); dirOpen.add(k); } rail(); }; b.onmouseenter = () => stage && stage.lit(fileStations(b.dataset.dir)); b.onmouseleave = () => stage && stage.lit(inspectLit()); });
    r.querySelectorAll("[data-more]").forEach(b => b.onclick = () => { const k = b.dataset.more; dirAll.has(k) ? dirAll.delete(k) : dirAll.add(k); rail(); });
    const c = r.querySelector(".cur"); if (c) { const t = c.offsetTop; if (t < r.scrollTop || t > r.scrollTop + r.clientHeight - 30) r.scrollTop = t - 50; }
  }
  const inspectLit = () => inspect ? (inspect.station ? [inspect.station] : inspect.file ? fileStations(inspect.file) : []) : [];
  function timeline() {
    const chs = []; L.steps.forEach((s, i) => { const c = chs[chs.length - 1]; if (c && c.name === s.chapter) c.ids.push(i); else chs.push({ name: s.chapter, ids: [i] }); });
    $("tl").innerHTML = chs.map(c => `<div class="tlc${c.ids.includes(cur) ? " cur" : ""}" style="flex-grow:${c.ids.length}"><span title="${esc(c.name)}">${esc(c.name)}</span><div class="tlt">${c.ids.map(i => `<button class="tick${i === cur ? " cur" : i < cur ? " done" : ""}" data-go="${i}" title="${i + 1}. ${esc(L.steps[i].title)}" aria-label="Step ${i + 1}: ${esc(L.steps[i].title)}"></button>`).join("")}</div></div>`).join("");
    $("tl").querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(+b.dataset.go));
  }
  function side() {

    $("legend").innerHTML = (L.stage.legend || []).map(x => `<span><i style="background:var(${x[1]})"></i>${esc(x[0])}</span>`).join("");
    try { if (is3D) { if (window.THREE) stage = Stage3D($("stage")); } else stage = Stage2D($("stage")); } catch (e) { console.error(e); stage = null; }
    if (!stage) { $("stage").innerHTML = `<div id="fallback"><div><b>The 3D view could not start in this browser.</b><br>Every step's data, explanation and code are still here.</div></div>`; $("zoombar").hidden = true; $("hint").classList.add("off"); }
    else {
      $("hint").textContent = is3D ? "Scroll to zoom · drag to move · click anything" : "Scroll to zoom · drag to move · click any part"; setTimeout(() => $("hint").classList.add("off"), 7000);
      $("zIn").onclick = () => stage.zoom(.72); $("zOut").onclick = () => stage.zoom(1.38);
      const setFollow = b => { $("zFollow").classList.toggle("on", b); $("zFollow").setAttribute("aria-pressed", String(b)); stage.follow(b); };
      $("zFit").onclick = () => setFollow(false); $("zFollow").onclick = () => setFollow(!$("zFollow").classList.contains("on"));
      if (stage.turn) { $("zTurn").hidden = false; $("zTurn").onclick = () => { const b = !$("zTurn").classList.contains("on"); $("zTurn").classList.toggle("on", b); $("zTurn").setAttribute("aria-pressed", String(b)); stage.turn(b); }; }
    }
    $("where").onclick = () => { const c = L.steps[cur].code; if (c) openFile(c.f); };
    $("bPrev").onclick = () => go(cur - 1); $("bNext").onclick = () => go(cur + 1); $("bPlay").onclick = () => { if (!playing && cur >= L.steps.length - 1) go(0); setPlay(!playing); };
    $("bSpeed").onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? .5 : 1; $("bSpeed").textContent = speed + "×"; schedule(); };
    $("bGuess").onclick = () => { guess = !guess; $("bGuess").classList.toggle("on", guess); show(cur); };
    addEventListener("keydown", e => { if (/INPUT|TEXTAREA/.test(e.target.tagName)) return; if (e.key === "ArrowRight") go(cur + 1); if (e.key === "ArrowLeft") go(cur - 1); if (e.key === "Escape") { if (inspect) closeInspect(); $("limits").hidden = true; $("bLimits").classList.remove("on"); } if (stage && (e.key === "+" || e.key === "=")) stage.zoom(.72); if (stage && e.key === "-") stage.zoom(1.38); if (stage && e.key === "0") $("zFit").click(); });
    const reload = () => { try { location.reload(); } catch (e) {} }; if (stage && L.stage.mode === "3d") { matchMedia("(prefers-color-scheme:dark)").addEventListener("change", reload); new MutationObserver(reload).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] }); }
    setPlay(false); const h = /^#step-(\d+)$/.exec(location.hash); show(h ? Math.min(L.steps.length, +h[1]) - 1 : 0);
    window.__lesson = { go, count: L.steps.length, mode: L.stage.mode, has3d: !!stage, stations: Object.keys(STN), openFile, stage };
  }
  const fonts = document.fonts && document.fonts.load ? Promise.all(['700 64px "Bricolage Grotesque"', '500 64px "JetBrains Mono"', '600 64px "JetBrains Mono"', '700 64px "JetBrains Mono"'].map(f => document.fonts.load(f))) : Promise.resolve();
  Promise.race([fonts, new Promise(r => setTimeout(r, 1500))]).catch(() => {}).then(boot);
})();
</script>
